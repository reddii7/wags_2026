# Member PWA (repo root). In Netlify → Site settings → Environment variables set:
#   VITE_SUPABASE_URL       (e.g. https://<ref>.supabase.co)
#   VITE_SUPABASE_ANON_KEY  (public anon key)
# Optional:
#   VITE_FETCH_ALL_DATA_URL (override edge function URL)
# Score entry password gate:
#   ENTRY_PASSWORD            (shared password for /entry)
#   ENTRY_PASSWORDS           (optional comma-separated extra passwords)
#   SUPABASE_SERVICE_ROLE_KEY (server-only key used by Netlify functions)
# Builds use fallbacks from src/lib/supabaseConfig.js if unset, but set these for production rotation.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/entry"
  to = "/entry/index.html"
  status = 200

[[redirects]]
  from = "/entry/*"
  to = "/entry/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Android Chrome home-screen opens "/" — that path must never be weaker than /index.html
# or devices keep a stale shell even after remove/re-add. iOS Web Clip logic is unchanged.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed Vite bundles — cache forever; HTML above always points at the current hash.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
