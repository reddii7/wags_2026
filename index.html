<!DOCTYPE html>
<html lang="en" style="background-color: #12151c">

<head>
  <meta charset="UTF-8" />
  <!-- Baseline viewport (required); apple standalone tags follow your spec -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WAGS</title>

  <!-- iOS Home Screen: launch without Safari chrome (minimal meta set per spec) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WAGS">

  <!-- Android Chrome install identity (does not change iOS Web Clip behaviour) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12151c">
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=__WAGS_SHELL_BUILD__" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=__WAGS_SHELL_BUILD__" />
  <link rel="icon" href="/favicon.ico?v=__WAGS_SHELL_BUILD__" sizes="any" />

  <!-- Saved Home Screen icons keep the first copy of this page. Do not
       location.replace before paint: iOS leaves that icon on a blank screen
       while Safari still opens the same link. If the saved copy asks for a
       file this deploy no longer has, boot.js (or this handler) opens the
       current page with a new address the icon has not cached. -->
  <script>
    (function () {
      try {
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || t === window) return;
            var isScript = t.tagName === "SCRIPT";
            var isStyle = t.tagName === "LINK" && t.rel === "stylesheet";
            if (!isScript && !isStyle) return;
            var lastKey = "wags-asset-reload";
            var last = parseInt(localStorage.getItem(lastKey) || "0", 10);
            if (Date.now() - last < 10000) return;
            localStorage.setItem(lastKey, String(Date.now()));
            var u = new URL("/", location.origin);
            u.searchParams.set("boot", String(Date.now()));
            location.href = u.toString();
          },
          true,
        );
        localStorage.setItem("wags-shell-build", "__WAGS_SHELL_BUILD__");
      } catch (e) {}
    })();
  </script>

  <!-- Vite/Vue standard entry -->
  <script type="module" src="/src/main.js"></script>
</head>

<body style="margin: 0; background-color: #12151c">
  <div id="app"></div>
</body>

</html>
